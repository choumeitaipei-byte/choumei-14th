<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北洲美扶輪社 第14屆 報名系統</title>
    <!-- 引入外部 CDN 工具 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 使用特定版本的 Babel 以確保環境相容性 -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        .bg-artistic {
            background-color: #003C6E;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 93, 170, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(247, 168, 27, 0.4) 0%, transparent 50%);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #EAE7E2; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    /**
     * 台北洲美扶輪社 第14屆 報名系統 - 穩定增強版
     */
    {
        const { useState } = React;

        // 自定義內嵌 SVG 圖示組件
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                ClipboardCheck: <path d="m9 11 2 2 4-4m-3-9a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h1ZM8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />,
                Users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 14v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
                HeartHandshake: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.82 2.96 0l2.96-2.96" />,
                DollarSign: <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />,
                Star: <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />,
                Sparkles: <path d="m12 3 1.91 5.84L20 10.75l-6.09 1.91L12 18.5l-1.91-5.84L4 10.75l6.09-1.91L12 3z M5 3l.5 1.5L7 5l-1.5.5L5 7l-.5-1.5L3 5l1.5-.5L5 3z M19 17l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5z" />,
                ChevronDown: <path d="m6 9 6 6 6-6" />,
                CheckCircle2: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" /></>,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01" /></>,
                Briefcase: <><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/><path d="M12 11h.01" /></>,
                Home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" /></>,
                Globe: <><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20" /></>,
                GraduationCap: <><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5" /></>,
                Send: <><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13" /></>
            };

            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const G_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjvWwyODcn8vu0-rG04xnKtjhJwxk5j7X6YKoOanwPmJ1Hj3LPzxVKcWEnr7Vos1Jp/exec";

            const [formData, setFormData] = useState({
                name: '',
                activeId: 'admin',
                selected: {}
            });
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const committees = [
                {
                    id: 'admin',
                    name: '行政管理委員會',
                    chair: 'PE Vincent',
                    limitText: '(請最少選擇3個)',
                    icon: 'ClipboardCheck',
                    color: '#9CA9AD',
                    items: ['出席 (Thomas)', '聯誼 (Elaine)', '節目 (PE Vincent)', '歌唱 (Vito)', '康樂 (PP Calvin)', '社刊/雜誌 (Shining)', '扶輪家庭 (Pan)', '互聯網網路社群 (Amber)', '健康促進 (Fumiko)', '登山 (PP Derek)', '高爾夫球及保齡球隊 (IPP Ethan)', '花藝 (Alice Chen)', '自行車隊 (PP Calvin)', '龍舟隊 (PP Rita)', '社慶特別委員會 (PE Vincent)']
                },
                {
                    id: 'membership',
                    name: '社員常務委員會',
                    chair: 'PN Chloe',
                    limitText: '(請最少選擇1個)',
                    icon: 'Users',
                    color: '#B9A19D',
                    items: ['扶輪知識 (PP Maya)', '社員關懷 (PP Ken)', '社員發展 (PP Showcase)', '職業分類 (JC)', '眷屬入社特別委員會 (PP Rita)']
                },
                {
                    id: 'service',
                    name: '服務計畫委員會',
                    chair: 'Peter',
                    limitText: '(請最少選擇2個)',
                    icon: 'HeartHandshake',
                    color: '#91A398',
                    groups: [
                        { label: '職業服務 (Joey Ku)', icon: 'Briefcase', items: ['職業發展 (David)', '職業促進 (PoChen)', '職業認識 (Amber)', '職業成就 (Ivan)', '扶輪義工 (Mariko)'] },
                        { label: '社區服務 (Jim)', icon: 'Home', items: ['人道關懷 (PP Lixin)', '社區發展 (Attorney)', '環境保護 (Phanix)', '惜食計劃 (Longer)'] },
                        { label: '國際服務 (Trainer)', icon: 'Globe', items: ['世界社區服務 (Aroma)', '教育行動 (Jay)', '地區年會推廣 (Chialin 家伶)', '姊妹社交流 (PE Vincent)'] },
                        { label: '青少年服務 (Camilla)', icon: 'GraduationCap', items: ['扶輪青少年交換計畫 (Adam)', '生命橋樑主委 (Anna)', 'RYLA委員會 (IPP Ethan)'] }
                    ]
                },
                {
                    id: 'foundation',
                    name: '扶輪基金委員會',
                    chair: 'IPP Ethan',
                    limitText: '(請最少選擇1個)',
                    icon: 'DollarSign',
                    color: '#A59288',
                    items: ['基金計畫 (PP Ken)', '基金發展 (CP Michael)']
                },
                {
                    id: 'special',
                    name: '糾察與公共形象',
                    chair: 'Eric / Artgen',
                    limitText: '(請最少選擇1個)',
                    icon: 'Star',
                    color: '#848E96',
                    items: ['糾察委員會 (Eric)', '公共形象委員會 (Artgen)']
                }
            ];

            const toggleItem = (commId, item) => {
                setError('');
                const current = formData.selected[commId] || [];

                if (current.includes(item)) {
                    setFormData(p => ({
                        ...p,
                        selected: { ...p.selected, [commId]: current.filter(i => i !== item) }
                    }));
                } else {
                    setFormData(p => ({
                        ...p,
                        selected: { ...p.selected, [commId]: [...current, item] }
                    }));
                }
            };

            const totalCount = Object.values(formData.selected).flat().length;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name) {
                    setError('請填寫 Nickname 以利作業。');
                    return;
                }
                
                if (totalCount < 3) {
                    setError(`請至少選擇 3 項職務（目前已選 ${totalCount} 項）。讓我們一起為社務盡一份心！`);
                    return;
                }

                setLoading(true);
                setError('');

                const finalSubs = [];
                committees.forEach(c => {
                    const sel = formData.selected[c.id];
                    if (sel && sel.length > 0) finalSubs.push(`【${c.name}】${sel.join(", ")}`);
                });

                try {
                    await fetch(G_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            name: formData.name,
                            committee: "第14屆招募-正式版",
                            subs: finalSubs
                        })
                    });
                    setTimeout(() => {
                        setLoading(false);
                        setSubmitted(true);
                        window.scrollTo(0,0);
                    }, 1000);
                } catch (err) {
                    setLoading(false);
                    setError('傳送失敗，請確認網路連線或腳本發佈權限。');
                }
            };

            if (submitted) {
                return (
                    <div className="min-h-screen bg-[#F0EFEB] flex items-center justify-center p-4">
                        <div className="bg-white rounded-[2.5rem] shadow-2xl p-10 max-w-lg w-full text-center border border-white">
                            <div className="bg-[#EAE7E2] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Icon name="CheckCircle2" className="text-[#91A398]" size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-[#4A4A4A] mb-2 font-serif">報名成功</h2>
                            <p className="text-[#8B8B8B] mb-8 text-sm italic">意願已同步至 Google Sheet</p>
                            <div className="space-y-3 text-left mb-8 max-h-48 overflow-y-auto pr-2 custom-scrollbar border-y border-[#F0EFEB] py-4">
                                {committees.map(c => {
                                    const items = formData.selected[c.id];
                                    if (!items || items.length === 0) return null;
                                    return (
                                        <div key={c.id} className="bg-[#FAF9F6] p-4 rounded-xl border border-[#EAE7E2]">
                                            <p className="font-bold text-xs text-[#4A4A4A] border-l-4 border-[#91A398] pl-2 mb-2">{c.name}</p>
                                            <div className="flex flex-wrap gap-1 text-[10px] text-[#6A6A6A]">
                                                {items.map(i => <span key={i} className="bg-white px-2 py-0.5 rounded border border-[#EAE7E2]">{i}</span>)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <button onClick={() => setSubmitted(false)} className="w-full bg-[#5D6D7E] text-white font-bold py-3 rounded-xl shadow-lg hover:bg-[#4A5968] transition-colors mt-6">返回重填</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F0EFEB] font-sans text-[#4A4A4A] pb-20">
                    {/* 正常比例 Banner */}
                    <header className="relative pt-12 pb-20 px-4 border-b-[6px] border-[#F7A81B] bg-artistic flex justify-center">
                        <div className="max-w-4xl w-full relative z-10 flex flex-col items-center text-center">
                            <div className="px-8 py-6 rounded-[2rem] bg-black/40 backdrop-blur-md border border-white/20 shadow-2xl space-y-3">
                                <h1 className="text-3xl md:text-5xl font-black text-white font-serif tracking-tight drop-shadow-md leading-tight">台北洲美扶輪社</h1>
                                <p className="text-[10px] md:text-base font-bold text-blue-100 tracking-[0.3em] uppercase opacity-80 border-t border-white/10 pt-2">Rotary Club of Taipei Choumei</p>
                                <div className="mt-1"><span className="text-5xl md:text-6xl font-black text-[#F7A81B] italic font-serif tracking-tighter">第十四屆</span></div>
                            </div>
                            <div className="mt-6">
                                <div className="inline-flex items-center gap-3 bg-white px-6 py-3 rounded-full shadow-lg border-b-[4px] border-slate-200">
                                    <Icon name="Sparkles" className="text-[#005DAA]" size={20} />
                                    <span className="text-base md:text-xl font-black tracking-widest text-[#005DAA] font-serif">2026-27年度 招兵買馬</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto px-4 -mt-8 relative z-20 space-y-6">
                        {/* 文案公告區 */}
                        <section className="bg-white/95 backdrop-blur-md rounded-[1.5rem] shadow-xl p-8 border border-white text-center">
                            <div className="mb-4 flex justify-center text-[#F7A81B]">
                                <Icon name="Sparkles" size={28} />
                            </div>
                            <h2 className="text-xl font-bold text-[#4A4A4A] mb-4 font-serif">精彩年度，由您開啟！</h2>
                            <p className="text-sm leading-relaxed text-[#6A6A6A] mb-4">
                                第十四屆服務團隊招兵買馬正式啟動！誠摯邀請各位社友踴躍填寫表單，加入您感興趣的委員會，與我們攜手並進。
                            </p>
                            <p className="text-xs text-[#9CA9AD] italic font-bold">
                                💡 各委員會主委亦請積極邀請社友加入，讓我們集思廣益，共創充滿創意與服務熱忱的一年！
                            </p>
                        </section>

                        {/* Nickname */}
                        <section className="bg-white rounded-[1.5rem] shadow-xl p-6 border border-white">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="bg-[#7B8C87] text-white w-8 h-8 rounded-lg flex items-center justify-center font-black shadow-sm">1</div>
                                <h3 className="font-bold font-serif text-[#4A4A4A]">請填寫您的 Nickname</h3>
                            </div>
                            <input 
                                type="text" placeholder="例如：Jerry"
                                className="w-full px-4 py-3 rounded-xl border-2 border-[#EAE7E2] outline-none focus:border-[#7B8C87] transition-all bg-[#FAF9F6] font-bold text-lg text-[#4A4A4A]"
                                value={formData.name}
                                onChange={e => setFormData(p => ({...p, name: e.target.value}))}
                            />
                        </section>

                        {/* Committees */}
                        <section className="bg-white rounded-[1.5rem] shadow-xl p-6 border border-white space-y-4">
                            <div className="flex items-center gap-3 mb-4 text-[#4A4A4A]">
                                <div className="bg-[#7B8C87] text-white w-8 h-8 rounded-lg flex items-center justify-center font-black shadow-sm">2</div>
                                <h3 className="font-bold font-serif">選擇委員會與服務項目</h3>
                            </div>
                            
                            {committees.map(c => {
                                const isOpen = formData.activeId === c.id;
                                const count = (formData.selected[c.id] || []).length;
                                return (
                                    <div key={c.id} className="border-b border-[#F0EFEB] last:border-0 pb-3 last:pb-0">
                                        <button 
                                            type="button"
                                            onClick={() => setFormData(p => ({...p, activeId: isOpen ? '' : c.id}))}
                                            className={`w-full p-4 rounded-2xl flex items-center gap-4 transition-all ${isOpen ? 'bg-[#FAF9F6] shadow-inner' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="p-2 rounded-lg text-white shadow-sm" style={{backgroundColor: c.color}}>
                                                <Icon name={c.icon} size={20} />
                                            </div>
                                            <div className="flex-1 text-left">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-[#4A4A4A]">{c.name}</span>
                                                    {count > 0 && <span className="bg-[#91A398] text-white text-[9px] px-1.5 py-0.5 rounded-full font-black shadow-sm">本組選 {count}</span>}
                                                </div>
                                                <p className="text-[10px] text-gray-400 font-bold">主委: {c.chair} <span className="text-[#E67E22] ml-1 font-black">{c.limitText}</span></p>
                                            </div>
                                            <Icon name="ChevronDown" className={`text-gray-300 transition-transform ${isOpen && 'rotate-180'}`} size={16} />
                                        </button>

                                        {isOpen && (
                                            <div className="mt-3 p-4 bg-[#FAF9F6] rounded-2xl border-2 border-dashed border-[#EAE7E2] space-y-4 animate-in slide-in-from-top-2 duration-300">
                                                {c.groups ? (
                                                    c.groups.map(g => (
                                                        <div key={g.label} className="bg-white p-3 rounded-xl shadow-sm border border-[#F0EFEB]">
                                                            <div className="flex items-center gap-2 mb-3 text-[11px] font-bold text-[#5D6D7E]">
                                                                <Icon name={g.icon} size={14} /> {g.label}
                                                            </div>
                                                            <div className="flex flex-wrap gap-2">
                                                                {g.items.map(item => {
                                                                    const sel = (formData.selected[c.id] || []).includes(item);
                                                                    return (
                                                                        <button key={item} type="button" onClick={() => toggleItem(c.id, item)}
                                                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-bold border-2 transition-all ${sel ? 'bg-[#5D6D7E] border-[#5D6D7E] text-white shadow-md' : 'bg-white border-transparent text-[#5A5A5A] shadow-sm hover:border-gray-200'}`}>
                                                                            {item}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="flex flex-wrap gap-2 px-2 pb-2">
                                                        {c.items.map(item => {
                                                            const sel = (formData.selected[c.id] || []).includes(item);
                                                            return (
                                                                <button key={item} type="button" onClick={() => toggleItem(c.id, item)}
                                                                    className={`px-3 py-2 rounded-lg text-xs font-bold border-2 transition-all ${sel ? 'bg-[#5D6D7E] border-[#5D6D7E] text-white shadow-md' : 'bg-white border-transparent text-[#5A5A5A] shadow-sm hover:border-gray-200'}`}>
                                                                    {item}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </section>

                        {/* 總計提示區 */}
                        <div className={`text-center font-bold text-xs py-2 rounded-full shadow-md transition-all duration-500 ${totalCount >= 3 ? 'bg-white text-[#91A398] animate-pulse' : 'bg-orange-50 text-orange-400 border border-orange-100'}`}>
                            {totalCount >= 3 ? `已達標！累計勾選：${totalCount} 個職務` : `目前已選 ${totalCount} 個，還差 ${3 - totalCount} 個職務達標`}
                        </div>

                        {error && <div className="text-red-500 text-center text-[10px] font-bold bg-red-50 py-2 rounded-lg border border-red-100">{error}</div>}

                        <button 
                            type="submit" 
                            disabled={loading || !formData.name}
                            onClick={handleSubmit}
                            className={`w-full py-4 rounded-2xl font-black text-lg text-white shadow-xl transition-all ${loading || !formData.name || totalCount < 3 ? 'bg-gray-300' : 'bg-[#5D6D7E] active:scale-95 border-b-4 border-[#2C3E50]'}`}
                        >
                            {loading ? '連線同步中...' : totalCount < 3 ? '請至少選取 3 個項目' : '確認提交報名意願'}
                        </button>

                        <footer className="text-center pt-8 opacity-30">
                            <p className="text-[10px] font-black tracking-widest text-[#8E9E9B]">TAIPEI CHOUMEI ROTARY</p>
                            <p className="text-[8px] font-bold">© 2026-2027 台北洲美扶輪社 第十四屆</p>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    }
    </script>
</body>
</html>
